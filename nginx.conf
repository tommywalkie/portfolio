server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The films keep the same file names when they are re-rendered: browsers must revalidate them (ETag /
    # Last-Modified, a 304 when nothing changed) instead of reusing an old chunk from their cache.
    location /videos/ {
        types {
            application/vnd.apple.mpegurl m3u8;
            video/iso.segment m4s;
            video/mp4 mp4;
        }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ ^/film__[^/]+\.mp4$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
