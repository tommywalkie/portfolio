name: Film render

# Renders the film(s) on GitHub's runners and cuts them into HLS for the website. Manual only (about 10-15 minutes
# per film). One job per language x theme x device (desktop 1920x1080, mobile 1080x1920 portrait).
# Result: the artifact `website-videos`, laid out like apps/website/public (film__*.mp4 and videos/<film>/...):
#   gh run download <run-id> -n website-videos -D apps/website/public
on:
  workflow_dispatch:
    inputs:
      music:
        description: Music bed under the effects
        type: choice
        default: kalimba
        options: [kalimba, warm, lofi, retro, drift, none]

permissions:
  contents: read

env:
  # earshot, the sound-kit engine (a uv tool). Unpinned: pin a commit here ("...earshot@<commit>") for reproducible sounds.
  EARSHOT_SPEC: 'earshot[mcp] @ git+https://github.com/Leonxlnx/earshot'

jobs:
  render:
    name: render ${{ matrix.lang }} ${{ matrix.theme }} ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lang: [fr, en]
        theme: [dark, light]
        device: [desktop, mobile]
    defaults:
      run:
        working-directory: apps/film
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # the version comes from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter cinetic-resume...
        working-directory: .

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/film/uv.lock

      # ffmpeg for the sound mix and the HLS cut; the libraries headless Chrome (Remotion) needs on Ubuntu 24.04
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libgbm-dev

      - run: uv tool install "$EARSHOT_SPEC"
      - run: uv sync --frozen

      # sound cues, earshot kit, effects, music, sea, whistle, then the picture. The text audit (an extra ~2 minutes)
      # is skipped here; it only warns anyway.
      - name: Render
        env:
          MUSIC: ${{ inputs.music }}
          TEXT_GATE: '0'
        run: |
          args=("${{ matrix.lang }}" --device "${{ matrix.device }}")
          if [ "${{ matrix.theme }}" = light ]; then args+=(--theme light); fi
          bash scripts/film-v1.1.sh "${args[@]}"

      # the file names film-v1.1.sh writes: __light for the light theme, __mobile for portrait, __en for English
      - name: Cut into HLS
        run: |
          suffix=""
          if [ "${{ matrix.theme }}" = light ]; then suffix="__light"; fi
          if [ "${{ matrix.device }}" = mobile ]; then suffix="${suffix}__mobile"; fi
          if [ "${{ matrix.lang }}" = en ]; then suffix="${suffix}__en"; fi
          bash scripts/portfolio-video.sh "film__version-v1.1${suffix}.mp4" "film-${{ matrix.lang }}-${{ matrix.theme }}-${{ matrix.device }}"
          ls -la ../website/public ../website/public/videos/*

      # videos are already compressed: no zip compression
      - uses: actions/upload-artifact@v7
        with:
          name: film-${{ matrix.lang }}-${{ matrix.theme }}-${{ matrix.device }}
          path: |
            apps/website/public/film__version-v1.1*.mp4
            apps/website/public/videos/film-${{ matrix.lang }}-${{ matrix.theme }}-${{ matrix.device }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  bundle:
    name: bundle website-videos
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: film-*
          merge-multiple: true
          path: bundle

      - uses: actions/upload-artifact@v7
        with:
          name: website-videos
          path: bundle
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### website-videos"
            echo
            echo '```'
            (cd bundle && find . -name '*.mp4' -o -name 'master.m3u8' | sort)
            du -sh bundle
            echo '```'
            echo "Download into the website: \`gh run download ${{ github.run_id }} -n website-videos -D apps/website/public\`"
          } >> "$GITHUB_STEP_SUMMARY"
